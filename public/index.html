<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梗王吐槽机 — 你说啥我都喷</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card-bg: #1a1a2e;
    --card-border: #2a2a4a;
    --accent: #e94560;
    --accent-2: #f39c12;
    --accent-3: #0f3460;
    --text: #eee;
    --text-dim: #888;
    --bubble-user: #16213e;
    --intensity-1: #2ecc71;
    --intensity-2: #f1c40f;
    --intensity-3: #e67e22;
    --intensity-4: #e74c3c;
    --intensity-5: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }
  .topbar .logo {
    font-weight: 800;
    font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }
  .topbar .counter {
    font-size: 12px;
    color: var(--text-dim);
    display: flex; gap: 10px; align-items: center;
  }
  .topbar .counter b { color: var(--accent); font-size: 14px; }
  .topbar .admin-link {
    font-size: 11px; color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--card-border);
    padding: 3px 10px; border-radius: 12px;
  }

  /* ===== 对话区域 ===== */
  .chat-area {
    position: fixed;
    top: 56px; bottom: 130px; left: 0; right: 0;
    overflow-y: auto;
    padding: 16px 12px 24px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 0; }

  /* 用户气泡 */
  .user-bubble {
    max-width: 78%;
    margin: 12px 0 4px auto;
    background: var(--bubble-user);
    border-radius: 16px 16px 4px 16px;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    word-break: break-word;
    animation: slideInRight 0.3s ease;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ===== 毒舌卡片 ===== */
  .roast-card {
    max-width: 92%;
    margin: 8px 0 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px 16px 16px 4px;
    overflow: hidden;
    animation: slideInLeft 0.4s ease;
    position: relative;
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px) translateY(8px); }
    to { opacity: 1; transform: translateX(0) translateY(0); }
  }

  /* 卡片头部：强度条 */
  .roast-card .card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 0;
  }
  .roast-card .emoji {
    font-size: 28px;
    line-height: 1;
  }
  .roast-card .intensity-bar {
    flex: 1;
    display: flex; gap: 3px;
  }
  .roast-card .intensity-bar span {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #333;
    transition: background 0.3s;
  }
  .roast-card .intensity-label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* 卡片正文 */
  .roast-card .card-body {
    padding: 12px 16px 14px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    word-break: break-word;
    font-weight: 500;
  }

  /* 卡片底部：梗标签 */
  .roast-card .card-footer {
    padding: 0 16px 12px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .roast-card .meme-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(233,69,96,0.15);
    color: var(--accent);
    border: 1px solid rgba(233,69,96,0.3);
  }

  /* 卡片操作栏 */
  .roast-card .card-actions {
    display: flex; gap: 8px;
    padding: 0 16px 12px;
  }
  .roast-card .action-btn {
    flex: 1;
    padding: 8px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .roast-card .action-btn:active {
    transform: scale(0.96);
  }
  .roast-card .action-btn:hover {
    background: rgba(233,69,96,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }
  .roast-card .action-btn .count {
    font-weight: 700;
  }

  /* 卡片补刀 */
  .roast-card .comeback {
    padding: 0 16px 14px;
    font-size: 13px;
    color: var(--text-dim);
    font-style: normal;
    border-top: 1px dashed rgba(255,255,255,0.08);
    padding-top: 10px;
    margin-top: 4px;
  }

  /* 加载动画 */
  .loading-card {
    max-width: 70%;
    margin: 8px 0;
    background: var(--card-bg);
    border-radius: 16px 16px 16px 4px;
    padding: 20px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .loading-dots {
    display: flex; gap: 4px;
  }
  .loading-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 0.6s infinite alternate;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    from { opacity: 0.3; transform: translateY(0); }
    to { opacity: 1; transform: translateY(-6px); }
  }
  .loading-card .loading-text {
    font-size: 14px; color: var(--text-dim);
  }

  /* ===== 欢迎卡片 ===== */
  .welcome-card {
    max-width: 90%;
    margin: 24px auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
  }
  .welcome-card .big-emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .welcome-card h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome-card p {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .welcome-card .start-btn {
    display: inline-block;
    padding: 10px 32px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .welcome-card .start-btn:active {
    transform: scale(0.96);
  }

  /* ===== 话题引导 ===== */
  .topic-pills {
    display: flex; gap: 8px;
    padding: 8px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .topic-pills::-webkit-scrollbar { display: none; }
  .topic-pill {
    flex-shrink: 0;
    padding: 6px 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .topic-pill:active {
    transform: scale(0.95);
  }
  .topic-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .topic-pill .pill-emoji {
    margin-right: 4px;
  }

  /* ===== 输入栏 ===== */
  .input-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 12px;
    z-index: 100;
    flex-direction: column;
  }
  .input-bar .input-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
  }
  .input-bar textarea {
    flex: 1;
    height: 44px;
    max-height: 80px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 18px;
    font-size: 15px;
    color: var(--text);
    resize: none;
    outline: none;
    font-family: inherit;
    line-height: 1.4;
    transition: border-color 0.2s;
  }
  .input-bar textarea:focus {
    border-color: var(--accent);
  }
  .input-bar textarea::placeholder {
    color: #555;
  }
  .input-bar .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
    flex-shrink: 0;
  }
  .input-bar .send-btn:active {
    transform: scale(0.9);
  }
  .input-bar .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== 暴击特效 ===== */
  .critical-hit {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px; font-weight: 900;
    color: var(--intensity-5);
    text-shadow: 0 0 20px rgba(233,69,96,0.6);
    pointer-events: none;
    z-index: 200;
    animation: critFlash 1s ease forwards;
  }
  @keyframes critFlash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }

  /* ===== 成就弹窗 ===== */
  .achievement-toast {
    position: fixed;
    bottom: 140px; left: 50%;
    transform: translateX(-50%);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 10px;
    z-index: 200;
    animation: toastSlide 0.4s ease, toastFade 3s ease forwards;
    box-shadow: 0 4px 20px rgba(233,69,96,0.3);
  }
  @keyframes toastSlide {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes toastFade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }
  .achievement-toast .ach-emoji {
    font-size: 24px;
  }
  .achievement-toast .ach-text {
    font-size: 13px;
  }
  .achievement-toast .ach-title {
    font-weight: 700;
    color: var(--accent);
  }

  /* 连续对话火焰指示器 */
  .streak-indicator {
    position: fixed;
    top: 60px; right: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--text-dim);
    z-index: 99;
    display: none;
    align-items: center; gap: 4px;
  }
  .streak-indicator.active {
    display: flex;
    border-color: var(--accent-2);
  }
  .streak-indicator .flame {
    font-size: 14px;
  }

  /* 响应式 */
  @media (max-width: 480px) {
    .roast-card .card-body { font-size: 15px; }
    .user-bubble { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🔥 梗王吐槽机</div>
  <div class="counter">
    <span>被喷 <b id="roastCount">0</b> 次</span>
    <a href="/admin.html" class="admin-link">📊 数据</a>
  </div>
</div>

<!-- 连续对话火焰 -->
<div class="streak-indicator" id="streakIndicator">
  <span class="flame">🔥</span>
  <span>连喷 <b id="streakCount">0</b></span>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome-card" id="welcomeCard">
    <div class="big-emoji">🤡</div>
    <h2>欢迎来到梗王吐槽机</h2>
    <p>你说啥我都喷。用最新的互联网梗疯狂吐槽你的每一句话。<br>不信你试试说点什么。</p>
    <button class="start-btn" onclick="startChat()">来吧，喷我</button>
  </div>
</div>

<div class="input-bar">
  <!-- 话题引导 -->
  <div class="topic-pills" id="topicPills"></div>
  <div class="input-row">
    <textarea id="userInput" placeholder="说点什么让梗王来喷你..." rows="1" disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">↑</button>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcomeCard = document.getElementById('welcomeCard');
const roastCountEl = document.getElementById('roastCount');
const topicPills = document.getElementById('topicPills');
const streakIndicator = document.getElementById('streakIndicator');
const streakCountEl = document.getElementById('streakCount');

let history = [];
let roastCount = 0;
let streak = 0;
let isWaiting = false;
let achievements = new Set();

// ===== 话题引导 =====
const TOPICS = [
  { emoji: '💪', text: '我今天特别努力', category: '自夸' },
  { emoji: '💔', text: '我失恋了很难过', category: '情感' },
  { emoji: '💼', text: '老板又让我加班', category: '职场' },
  { emoji: '🍜', text: '今天又吃外卖', category: '日常' },
  { emoji: '😴', text: '我今天睡到中午', category: '摆烂' },
  { emoji: '🤑', text: '我是全公司最帅的', category: '自恋' },
  { emoji: '📚', text: '明天考试我还没复习', category: '校园' },
  { emoji: '🤔', text: '你觉得人生的意义是什么', category: '哲学' },
  { emoji: '🎮', text: '我又打了一天游戏', category: '摆烂' },
  { emoji: '😭', text: '没人懂我', category: '卖惨' },
];

// 根据对话轮次动态切换话题
function refreshTopics(round) {
  const start = (round * 5) % TOPICS.length;
  const picked = [];
  for (let i = 0; i < 5; i++) {
    picked.push(TOPICS[(start + i) % TOPICS.length]);
  }
  topicPills.innerHTML = picked.map((t, i) =>
    `<div class="topic-pill" onclick="useTopic('${t.text.replace(/'/g,"\\'")}')"><span class="pill-emoji">${t.emoji}</span>${t.text}</div>`
  ).join('');
}

function useTopic(text) {
  userInput.value = text;
  userInput.style.height = 'auto';
  sendMessage();
}

// ===== 成就系统 =====
const ACHIEVEMENTS = {
  first_blood: { emoji: '🩸', title: '初次被喷', desc: '第一次被梗王吐槽了' },
  chatty: { emoji: '💬', title: '话痨', desc: '连续对话5轮' },
  masochist: { emoji: '🤕', title: '受虐狂', desc: '被喷10次还在聊' },
  critical_hit: { emoji: '💥', title: '承受暴击', desc: '扛住了5级核弹吐槽' },
  streak_5: { emoji: '🔥', title: '连喷达人', desc: '连续5轮不中断' },
  streak_10: { emoji: '🔥🔥', title: '连喷王者', desc: '连续10轮不中断' },
  philosopher: { emoji: '🧠', title: '哲学家', desc: '聊到了人生哲学' },
  comeback_king: { emoji: '👑', title: '怼回去了', desc: '被吐槽后说了"你才"' },
};

function unlockAchievement(id) {
  if (achievements.has(id)) return;
  achievements.add(id);
  const ach = ACHIEVEMENTS[id];
  if (!ach) return;

  const toast = document.createElement('div');
  toast.className = 'achievement-toast';
  toast.innerHTML = `
    <span class="ach-emoji">${ach.emoji}</span>
    <div class="ach-text">
      <div class="ach-title">${ach.title}</div>
      <div style="color:var(--text-dim);font-size:11px">${ach.desc}</div>
    </div>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function checkAchievements(text, intensity) {
  if (roastCount === 1) unlockAchievement('first_blood');
  if (roastCount >= 10) unlockAchievement('masochist');
  if (intensity >= 5) unlockAchievement('critical_hit');
  if (streak >= 5) unlockAchievement('streak_5');
  if (streak >= 10) unlockAchievement('streak_10');
  if (text.includes('人生') || text.includes('意义') || text.includes('哲学')) unlockAchievement('philosopher');
  if (text.includes('你才') || text.includes('你先') || text.includes('你自己')) unlockAchievement('comeback_king');
}

// ===== 连续对话火焰 =====
function updateStreak() {
  streak++;
  streakCountEl.textContent = streak;
  if (streak >= 3) {
    streakIndicator.classList.add('active');
  }
}

function startChat() {
  if (welcomeCard) welcomeCard.remove();
  userInput.disabled = false;
  sendBtn.disabled = false;
  refreshTopics(0);
  userInput.focus();
}

// 自适应高度
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 80) + 'px';
});

// Enter 发送
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'user-bubble';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addLoadingCard() {
  const div = document.createElement('div');
  div.className = 'loading-card';
  div.id = 'loadingCard';
  const msgs = ['梗王正在组织语言...', '姐妹整理一下措辞...', '等一下，让我想个更毒的...'];
  div.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div><span class="loading-text">' + msgs[Math.floor(Math.random()*msgs.length)] + '</span>';
  chatArea.appendChild(div);
  scrollToBottom();
}

function removeLoadingCard() {
  const el = document.getElementById('loadingCard');
  if (el) el.remove();
}

function addRoastCard(data) {
  const intensity = data.intensity || 3;
  const intensityColors = ['#2ecc71','#f1c40f','#e67e22','#e74c3c','#c0392b'];
  const intensityLabels = ['轻调侃','有点损','毒舌级','暴击','核弹级'];

  const div = document.createElement('div');
  div.className = 'roast-card';
  div.dataset.intensity = intensity;

  // 强度条
  let bars = '';
  for (let i = 0; i < 5; i++) {
    const color = i < intensity ? intensityColors[intensity-1] : '#333';
    bars += `<span style="background:${color}"></span>`;
  }

  // 梗标签
  let memeTags = '';
  if (data.meme_used && Array.isArray(data.meme_used)) {
    data.meme_used.forEach(m => {
      memeTags += `<span class="meme-tag">#${m}</span>`;
    });
  }

  // 补刀提示
  const comeback = data.comeback_hint || '';

  div.innerHTML = `
    <div class="card-header">
      <span class="emoji">${data.emoji || '😏'}</span>
      <div class="intensity-bar">${bars}</div>
      <span class="intensity-label">${intensityLabels[intensity-1] || '毒舌级'}</span>
    </div>
    <div class="card-body">${escapeHtml(data.roast || '...')}</div>
    ${memeTags ? `<div class="card-footer">${memeTags}</div>` : ''}
    <div class="card-actions">
      <button class="action-btn" onclick="reactToRoast(this, '😂')">😂 绷不住</button>
      <button class="action-btn" onclick="reactToRoast(this, '😡')">😡 被气到</button>
      <button class="action-btn" onclick="reactToRoast(this, '💀')">💀 扎心了</button>
      ${comeback ? `<button class="action-btn" onclick="reactToRoast(this, 'comeback')">↩️ ${escapeHtml(comeback)}</button>` : ''}
    </div>
  `;

  chatArea.appendChild(div);

  // 暴击特效
  if (intensity >= 5) {
    showCriticalHit();
  }

  roastCount++;
  roastCountEl.textContent = roastCount;
  scrollToBottom();
}

// 用户对吐槽的反应
function reactToRoast(btn, type) {
  if (type === 'comeback') {
    // 点击补刀提示 → 自动填入并发送
    const text = btn.textContent.replace('↩️ ', '');
    userInput.value = text;
    sendMessage();
    return;
  }

  // 表情反应
  const reactions = {
    '😂': { reply: '你还笑？笑得出来说明喷得不够狠', emoji: '😏' },
    '😡': { reply: '急了急了，看来被我说中了', emoji: '😤' },
    '💀': { reply: '扎心了？这才哪到哪，姐妹', emoji: '💅' },
  };
  const r = reactions[type];
  if (!r) return;

  // 禁用按钮，显示计数
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';
  let count = parseInt(btn.querySelector('.count')?.textContent || '0') + 1;
  btn.innerHTML = `${type} <span class="count">${count}</span>`;

  // 偶尔追加一句话（前3次反应才追加）
  if (count <= 2) {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'roast-card';
      div.innerHTML = `
        <div class="card-header">
          <span class="emoji">${r.emoji}</span>
          <span style="font-size:11px;color:var(--text-dim)">梗王追加</span>
        </div>
        <div class="card-body" style="font-size:14px;padding:8px 16px 12px">${r.reply}</div>
      `;
      chatArea.appendChild(div);
      scrollToBottom();
    }, 800);
  }
}

function showCriticalHit() {
  const texts = ['💥 暴击！', '☢️ 核弹级吐槽！', '🔥 毁灭打击！', '☠️ 致命一喷！'];
  const text = texts[Math.floor(Math.random() * texts.length)];
  const el = document.createElement('div');
  el.className = 'critical-hit';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function scrollToBottom() {
  setTimeout(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 50);
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isWaiting) return;

  isWaiting = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  addUserBubble(text);
  addLoadingCard();

  history.push({ role: 'user', content: text });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history.slice(-10)
      })
    });

    if (!res.ok) throw new Error('API error: ' + res.status);

    const data = await res.json();

    removeLoadingCard();

    if (data.roast) {
      addRoastCard(data);
      history.push({ role: 'assistant', content: data.roast });
      updateStreak();
      checkAchievements(text, data.intensity || 3);
      refreshTopics(roastCount);
    } else {
      addRoastCard({
        roast: '你这话把梗王CPU干烧了...容我缓缓。',
        emoji: '🤯',
        intensity: 3,
        meme_used: ['CPU烧了'],
        comeback_hint: '要不要再试试说点人话？'
      });
    }
  } catch (err) {
    removeLoadingCard();
    addRoastCard({
      roast: '不是哥们，服务器都让你说宕机了。',
      emoji: '💀',
      intensity: 4,
      meme_used: ['不是哥们'],
      comeback_hint: '网络开小差了，再试一次？'
    });
    console.error('Error:', err);
  }

  isWaiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}
</script>
